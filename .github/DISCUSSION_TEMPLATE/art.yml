body:
  - type: markdown
    attributes:
      value: |
        🎨 **Art** 카테고리 · Category를 **Art**로 선택했는지 확인하세요.

        **frontmatter 안내**
        - `coverImage` — 카드·상세에 쓰는 16:10 썸네일 URL
        - `galleryImage` — Art 갤러리에 원본 비율로 보여줄 이미지 URL (비우면 `coverImage` 사용)
        - `featured` — `true`면 홈 Featured 후보
        - `featuredOrder` — 고정글 순서, 작을수록 앞 (1 → 2 → 3)
        - `published` — `true`면 블로그 공개, `false`면 숨김
        - `tags` — 검색용 키워드 (카테고리와 별개)

        보통은 `published: true`만 확인하고 frontmatter 아래에 본문을 작성하면 됩니다.
  - type: textarea
    id: post-body
    attributes:
      label: 포스트 본문
      description: frontmatter 아래에 본문을 작성하세요
      value: |
        ---
        coverImage:
        galleryImage:
        featured: false
        featuredOrder: 1
        published: true
        tags: []
        ---

    validations:
      required: true
