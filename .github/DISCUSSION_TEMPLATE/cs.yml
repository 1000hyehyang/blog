body:
  - type: textarea
    id: post-body
    attributes:
      label: 포스트 본문
      description: Markdown으로 작성하세요. 이미지는 드래그해서 첨부할 수 있습니다.
      value: "\n\n---"
    validations:
      required: true
  - type: textarea
    id: cover-image
    attributes:
      label: 대표 이미지
      description: 이미지 파일을 드래그하거나 외부 이미지 URL을 붙여 넣으세요. 비워두면 기본 이미지가 사용됩니다.
      placeholder: 이미지 또는 https:// URL
  - type: input
    id: tags
    attributes:
      label: 태그
      description: 검색에 사용할 태그를 쉼표로 구분해 입력하세요.
      placeholder: 자료구조, 운영체제, 데이터베이스
  - type: dropdown
    id: featured
    attributes:
      label: Featured
      description: 홈 Featured 영역에 노출할지 선택하세요.
      options: [아니요, 예]
      default: 0
    validations:
      required: true
  - type: input
    id: featured-order
    attributes:
      label: Featured 순서
      description: Featured일 때만 입력하세요. 숫자가 작을수록 앞에 표시됩니다.
      placeholder: "1"
  - type: dropdown
    id: published
    attributes:
      label: 공개 상태
      options: [비공개, 공개]
      default: 1
    validations:
      required: true
